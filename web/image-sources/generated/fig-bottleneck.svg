<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="t d" font-family="'Segoe UI Variable', 'Segoe UI', Inter, Roboto, Arial, sans-serif">
  <title id="t">Where the time goes</title>
  <desc id="d">Two rows of six stages. Before agents every stage is equally long. With agents the Build stage shrinks and the remaining human-speed stages set the pace.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050c1d"/><stop offset="1" stop-color="#0a1a3d"/></linearGradient>
    <radialGradient id="g1" cx="0.9" cy="0.0" r="0.7"><stop offset="0" stop-color="#5b9bff" stop-opacity="0.28"/><stop offset="1" stop-color="#5b9bff" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0.05" cy="1" r="0.6"><stop offset="0" stop-color="#2ad4ff" stop-opacity="0.2"/><stop offset="1" stop-color="#2ad4ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1d40"/><stop offset="1" stop-color="#0b1733"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2ad4ff"/><stop offset="1" stop-color="#5b9bff"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8ec1ff"/><stop offset="1" stop-color="#2ad4ff"/></linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#5b9bff" fill-opacity="0.16"/></pattern>
    <style>
      .flow { fill: none; stroke: #5b9bff; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 8 8; animation: dash 0.9s linear infinite; }
      .flow.cy { stroke: #2ad4ff; }
      .flow.mute { stroke: #6b7fa8; }
      @keyframes dash { to { stroke-dashoffset: -16; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } .dot { display: none; } }
    </style>
  </defs>
  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#dots)"/>
  <rect width="1600" height="800" fill="url(#g1)"/>
  <rect width="1600" height="800" fill="url(#g2)"/>
<text x="80" y="92" font-size="42" font-weight="800" fill="#e8f0ff" letter-spacing="-1">Where the time goes</text><text x="80" y="134" font-size="21" fill="#93a8d1">Illustrative, not measured: when build runs at agent speed, the human-speed stages around it set the pace.</text><text x="110" y="226" font-size="24" font-weight="750" fill="#e8f0ff">Before agents</text><text x="285" y="226" font-size="18" fill="#93a8d1">every stage runs at human speed</text><rect x="110" y="250" width="220" height="74" rx="16" fill="url(#card)" stroke="#24407e" stroke-width="1.5"/><text x="220" y="296" text-anchor="middle" font-size="22" font-weight="700" fill="#e8f0ff">Plan</text><rect x="342" y="250" width="220" height="74" rx="16" fill="url(#card)" stroke="#24407e" stroke-width="1.5"/><text x="452" y="296" text-anchor="middle" font-size="22" font-weight="700" fill="#e8f0ff">Design</text><rect x="574" y="250" width="220" height="74" rx="16" fill="url(#card)" stroke="#24407e" stroke-width="1.5"/><text x="684" y="296" text-anchor="middle" font-size="22" font-weight="700" fill="#e8f0ff">Build</text><rect x="806" y="250" width="220" height="74" rx="16" fill="url(#card)" stroke="#24407e" stroke-width="1.5"/><text x="916" y="296" text-anchor="middle" font-size="22" font-weight="700" fill="#e8f0ff">Test</text><rect x="1038" y="250" width="220" height="74" rx="16" fill="url(#card)" stroke="#24407e" stroke-width="1.5"/><text x="1148" y="296" text-anchor="middle" font-size="22" font-weight="700" fill="#e8f0ff">Deploy</text><rect x="1270" y="250" width="220" height="74" rx="16" fill="url(#card)" stroke="#24407e" stroke-width="1.5"/><text x="1380" y="296" text-anchor="middle" font-size="22" font-weight="700" fill="#e8f0ff">Maintain</text><text x="110" y="456" font-size="24" font-weight="750" fill="#e8f0ff">With agents</text><text x="260" y="456" font-size="18" fill="#93a8d1">build runs at agent speed</text><rect x="110" y="480" width="220" height="74" rx="16" fill="url(#card)" stroke="#24407e" stroke-width="1.5"/><text x="220" y="526" text-anchor="middle" font-size="22" font-weight="700" fill="#e8f0ff">Plan</text><rect x="342" y="480" width="220" height="74" rx="16" fill="url(#card)" stroke="#24407e" stroke-width="1.5"/><text x="452" y="526" text-anchor="middle" font-size="22" font-weight="700" fill="#e8f0ff">Design</text><rect x="574" y="480" width="56" height="74" rx="16" fill="url(#brand)"/><text x="602" y="526" text-anchor="middle" font-size="15" font-weight="700" fill="#04112b">Build</text><rect x="642" y="480" width="220" height="74" rx="16" fill="url(#card)" stroke="#24407e" stroke-width="1.5"/><text x="752" y="526" text-anchor="middle" font-size="22" font-weight="700" fill="#e8f0ff">Test</text><rect x="874" y="480" width="220" height="74" rx="16" fill="url(#card)" stroke="#24407e" stroke-width="1.5"/><text x="984" y="526" text-anchor="middle" font-size="22" font-weight="700" fill="#e8f0ff">Deploy</text><rect x="1106" y="480" width="220" height="74" rx="16" fill="url(#card)" stroke="#24407e" stroke-width="1.5"/><text x="1216" y="526" text-anchor="middle" font-size="22" font-weight="700" fill="#e8f0ff">Maintain</text><rect x="1338" y="480" width="152" height="74" rx="16" fill="none" stroke="#2ad4ff" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="1414" y="514" text-anchor="middle" font-size="15" font-weight="700" fill="#2ad4ff">cycle time</text><text x="1414" y="535" text-anchor="middle" font-size="15" font-weight="700" fill="#2ad4ff">reclaimed</text><path d="M118 576 H322" stroke="#2ad4ff" stroke-width="2" stroke-linecap="round"/><text x="220" y="606" text-anchor="middle" font-size="18" font-weight="650" fill="#8ec1ff">requirements</text><text x="220" y="630" text-anchor="middle" font-size="15" fill="#93a8d1">still human speed</text><path d="M650 576 H854" stroke="#2ad4ff" stroke-width="2" stroke-linecap="round"/><text x="752" y="606" text-anchor="middle" font-size="18" font-weight="650" fill="#8ec1ff">review</text><text x="752" y="630" text-anchor="middle" font-size="15" fill="#93a8d1">still human speed</text><path d="M882 576 H1086" stroke="#2ad4ff" stroke-width="2" stroke-linecap="round"/><text x="984" y="606" text-anchor="middle" font-size="18" font-weight="650" fill="#8ec1ff">release</text><text x="984" y="630" text-anchor="middle" font-size="15" fill="#93a8d1">still human speed</text><rect x="110" y="690" width="1380" height="54" rx="27" fill="#5b9bff" fill-opacity=".14" stroke="#5b9bff" stroke-opacity=".55"/><text x="800" y="723.65" text-anchor="middle" font-size="19" font-weight="650" fill="#e8f0ff">The bottleneck moves to the steps left and right of build: plan, review and test, and deploy.</text></svg>
