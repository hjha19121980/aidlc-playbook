<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="t d" font-family="'Segoe UI Variable', 'Segoe UI', Inter, Roboto, Arial, sans-serif">
  <title id="t">Control bands and response tiers</title>
  <desc id="d">A metric over time with its mean and one, two and three sigma bands. Crossing three sigma triggers the agent, which writes the finding as a new intent. Response tiers: log, diagnose read-only, propose through a pull request or approved runbook.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050c1d"/><stop offset="1" stop-color="#0a1a3d"/></linearGradient>
    <radialGradient id="g1" cx="0.9" cy="0.0" r="0.7"><stop offset="0" stop-color="#5b9bff" stop-opacity="0.28"/><stop offset="1" stop-color="#5b9bff" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0.05" cy="1" r="0.6"><stop offset="0" stop-color="#2ad4ff" stop-opacity="0.2"/><stop offset="1" stop-color="#2ad4ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1d40"/><stop offset="1" stop-color="#0b1733"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2ad4ff"/><stop offset="1" stop-color="#5b9bff"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8ec1ff"/><stop offset="1" stop-color="#2ad4ff"/></linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#5b9bff" fill-opacity="0.16"/></pattern>
    <style>
      .flow { fill: none; stroke: #5b9bff; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 8 8; animation: dash 0.9s linear infinite; }
      .flow.cy { stroke: #2ad4ff; }
      .flow.mute { stroke: #6b7fa8; }
      @keyframes dash { to { stroke-dashoffset: -16; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } .dot { display: none; } }
    </style>
  </defs>
  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#dots)"/>
  <rect width="1600" height="800" fill="url(#g1)"/>
  <rect width="1600" height="800" fill="url(#g2)"/>
<text x="80" y="92" font-size="42" font-weight="800" fill="#e8f0ff" letter-spacing="-1">Detection stays deterministic</text><text x="80" y="134" font-size="21" fill="#93a8d1">The agent is invoked only after a band is breached, and the tier sets what it may do.</text><rect x="70" y="180" width="820" height="520" rx="20" fill="url(#card)" stroke="#24407e" stroke-width="1.5"/><rect x="90" y="284" width="710" height="312" fill="#ff6b6b" fill-opacity="0.05"/>
    <path d="M90 284 H800 M90 596 H800" stroke="#ff6b6b" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="6 6"/>
    <text x="824" y="289" font-size="17" font-weight="800" fill="#ff6b6b">3σ</text><rect x="90" y="336" width="710" height="208" fill="#ffd166" fill-opacity="0.05"/>
    <path d="M90 336 H800 M90 544 H800" stroke="#ffd166" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="6 6"/>
    <text x="824" y="341" font-size="17" font-weight="800" fill="#ffd166">2σ</text><rect x="90" y="388" width="710" height="104" fill="#3ddc97" fill-opacity="0.05"/>
    <path d="M90 388 H800 M90 492 H800" stroke="#3ddc97" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="6 6"/>
    <text x="824" y="393" font-size="17" font-weight="800" fill="#3ddc97">1σ</text><path d="M90 440 H800" stroke="#8ec1ff" stroke-width="2"/><polyline points="110.0,434.8 149.4,455.6 188.8,421.8 228.2,447.8 267.6,419.2 307.1,466.0 346.5,427.0 385.9,408.8 425.3,416.6 464.7,393.2 504.1,385.4 543.5,367.2 582.9,377.6 622.4,341.2 661.8,320.4 701.2,258.0 740.6,325.6 780.0,388.0" fill="none" stroke="#e8f0ff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="701.1764705882354" cy="258" r="12" fill="#ff6b6b" fill-opacity=".25"/><circle cx="701.1764705882354" cy="258" r="6" fill="#ff6b6b"/><text x="719.1764705882354" y="246" font-size="16" font-weight="800" fill="#ff6b6b">breach</text><text x="94" y="682" font-size="15" fill="#93a8d1">time. Solid line: rolling baseline. Dashed lines: 1, 2 and 3 sigma.</text><text x="94" y="214" font-size="15" fill="#93a8d1">metric, for example CI test failure rate</text><rect x="950" y="180" width="580" height="108" rx="18" fill="url(#card)" stroke="#3ddc97" stroke-width="1.5"/><text x="978" y="246" font-size="34" font-weight="800" fill="#3ddc97">1σ</text><text x="1070" y="226" font-size="24" font-weight="750" fill="#e8f0ff">Log only</text><text x="1070" y="258" font-size="17" fill="#93a8d1">Record the movement.</text><g transform="translate(1468 216) scale(1.4)" fill="none" stroke="#3ddc97" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></g><rect x="950" y="310" width="580" height="108" rx="18" fill="url(#card)" stroke="#ffd166" stroke-width="1.5"/><text x="978" y="376" font-size="34" font-weight="800" fill="#ffd166">2σ</text><text x="1070" y="356" font-size="24" font-weight="750" fill="#e8f0ff">Diagnose</text><text x="1070" y="388" font-size="17" fill="#93a8d1">A read-only agent investigates.</text><g transform="translate(1468 346) scale(1.4)" fill="none" stroke="#ffd166" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 11m-7 0a7 7 0 1 0 14 0a7 7 0 1 0-14 0"/><path d="M21 21l-5-5"/></g><rect x="950" y="440" width="580" height="108" rx="18" fill="url(#card)" stroke="#ff6b6b" stroke-width="1.5"/><text x="978" y="506" font-size="34" font-weight="800" fill="#ff6b6b">3σ</text><text x="1070" y="486" font-size="24" font-weight="750" fill="#e8f0ff">Propose</text><text x="1070" y="518" font-size="17" fill="#93a8d1">Only via a pull request or a pre-approved runbook.</text><g transform="translate(1468 476) scale(1.4)" fill="none" stroke="#ff6b6b" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5m-2 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0"/><path d="M6 19m-2 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0"/><path d="M18 18m-2 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0"/><path d="M6 7v10"/><path d="M18 16V9a3 3 0 0 0-3-3h-3"/><path d="M13 4l-2 2 2 2"/></g><path class="flow cy" d="M1240 558 L1240.0 588.0"/><polygon points="1240.0,600.0 1232.0,586.0 1248.0,586.0" fill="#2ad4ff"/><rect x="950" y="606" width="580" height="94" rx="18" fill="url(#brand)"/><text x="1240" y="646" text-anchor="middle" font-size="24" font-weight="800" fill="#04112b">incident.md + new intent.md</text><text x="1240" y="676" text-anchor="middle" font-size="17" font-weight="650" fill="#04112b">Triaged by a person, then through the review gate</text></svg>
