<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="t d" font-family="'Segoe UI Variable', 'Segoe UI', Inter, Roboto, Arial, sans-serif">
  <title id="t">Autonomy tiers by environment</title>
  <desc id="d">Three environments: development where the agent deploys freely, staging where it deploys within checks, and production where the agent prepares the release and a release manager authorizes it at a gate. Rollback is rehearsed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050c1d"/><stop offset="1" stop-color="#0a1a3d"/></linearGradient>
    <radialGradient id="g1" cx="0.9" cy="0.0" r="0.7"><stop offset="0" stop-color="#5b9bff" stop-opacity="0.28"/><stop offset="1" stop-color="#5b9bff" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0.05" cy="1" r="0.6"><stop offset="0" stop-color="#2ad4ff" stop-opacity="0.2"/><stop offset="1" stop-color="#2ad4ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1d40"/><stop offset="1" stop-color="#0b1733"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2ad4ff"/><stop offset="1" stop-color="#5b9bff"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8ec1ff"/><stop offset="1" stop-color="#2ad4ff"/></linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#5b9bff" fill-opacity="0.16"/></pattern>
    <style>
      .flow { fill: none; stroke: #5b9bff; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 8 8; animation: dash 0.9s linear infinite; }
      .flow.cy { stroke: #2ad4ff; }
      .flow.mute { stroke: #6b7fa8; }
      @keyframes dash { to { stroke-dashoffset: -16; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } .dot { display: none; } }
    </style>
  </defs>
  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#dots)"/>
  <rect width="1600" height="800" fill="url(#g1)"/>
  <rect width="1600" height="800" fill="url(#g2)"/>
<text x="80" y="92" font-size="42" font-weight="800" fill="#e8f0ff" letter-spacing="-1">The agent acts up to the production gate and cannot pass it</text><text x="80" y="134" font-size="21" fill="#93a8d1">Tier autonomy by environment. Each tier is enforced by configuration, not by habit.</text><rect x="80" y="200" width="420" height="340" rx="22" fill="url(#card)" stroke="#24407e" stroke-width="1.5"/><rect x="106" y="226" width="60" height="60" rx="16.8" fill="url(#brand)"/><g transform="translate(118 238) scale(1.5)" fill="none" stroke="#04112b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4z"/><path d="M7 10l3 2-3 2"/><path d="M13 15h4"/></g><text x="184" y="266" font-size="30" font-weight="800" fill="#e8f0ff">Development</text><text x="106" y="338" font-size="21" font-weight="650" fill="#8ec1ff">Agent deploys freely</text>
    <text x="106" y="400" font-size="14" font-weight="700" letter-spacing="1.5" fill="#93a8d1">AGENT AUTONOMY</text><rect x="106" y="416" width="64" height="16" rx="8" fill="url(#brand)"/><rect x="180" y="416" width="64" height="16" rx="8" fill="url(#brand)"/><rect x="254" y="416" width="64" height="16" rx="8" fill="url(#brand)"/><rect x="328" y="416" width="64" height="16" rx="8" fill="url(#brand)"/><rect x="402" y="416" width="64" height="16" rx="8" fill="url(#brand)"/><text x="106" y="480" font-size="17" fill="#93a8d1">Fast feedback, no standing risk.</text><rect x="590" y="200" width="420" height="340" rx="22" fill="url(#card)" stroke="#24407e" stroke-width="1.5"/><rect x="616" y="226" width="60" height="60" rx="16.8" fill="url(#brand)"/><g transform="translate(628 238) scale(1.5)" fill="none" stroke="#04112b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/><path d="M3 17l9 5 9-5"/></g><text x="694" y="266" font-size="30" font-weight="800" fill="#e8f0ff">Staging</text><text x="616" y="338" font-size="21" font-weight="650" fill="#8ec1ff">Agent deploys within checks</text>
    <text x="616" y="400" font-size="14" font-weight="700" letter-spacing="1.5" fill="#93a8d1">AGENT AUTONOMY</text><rect x="616" y="416" width="64" height="16" rx="8" fill="url(#brand)"/><rect x="690" y="416" width="64" height="16" rx="8" fill="url(#brand)"/><rect x="764" y="416" width="64" height="16" rx="8" fill="url(#brand)"/><rect x="838" y="416" width="64" height="16" rx="8" fill="#24407e" fill-opacity=".6"/><rect x="912" y="416" width="64" height="16" rx="8" fill="#24407e" fill-opacity=".6"/><text x="616" y="480" font-size="17" fill="#93a8d1">Same pipeline, narrower powers.</text><rect x="1100" y="200" width="420" height="340" rx="22" fill="url(#card)" stroke="#2ad4ff" stroke-width="1.5"/><rect x="1126" y="226" width="60" height="60" rx="16.8" fill="url(#brand)"/><g transform="translate(1138 238) scale(1.5)" fill="none" stroke="#04112b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></g><text x="1204" y="266" font-size="30" font-weight="800" fill="#e8f0ff">Production</text><text x="1126" y="338" font-size="21" font-weight="650" fill="#8ec1ff">Agent prepares the release</text>
    <text x="1126" y="400" font-size="14" font-weight="700" letter-spacing="1.5" fill="#93a8d1">AGENT AUTONOMY</text><rect x="1126" y="416" width="64" height="16" rx="8" fill="url(#brand)"/><rect x="1200" y="416" width="64" height="16" rx="8" fill="#24407e" fill-opacity=".6"/><rect x="1274" y="416" width="64" height="16" rx="8" fill="#24407e" fill-opacity=".6"/><rect x="1348" y="416" width="64" height="16" rx="8" fill="#24407e" fill-opacity=".6"/><rect x="1422" y="416" width="64" height="16" rx="8" fill="#24407e" fill-opacity=".6"/><text x="1126" y="480" font-size="17" fill="#e8f0ff">A named release manager authorizes.</text><text x="1126" y="506" font-size="17" fill="#93a8d1">A check enforces it every time.</text><path class="flow" d="M510 370 L568.0 370.0"/><polygon points="580.0,370.0 566.0,378.0 566.0,362.0" fill="#5b9bff"/><path class="flow" d="M1020 370 L1038.0 370.0"/><polygon points="1050.0,370.0 1036.0,378.0 1036.0,362.0" fill="#5b9bff"/><rect x="1052" y="250" width="10" height="240" rx="5" fill="#2ad4ff"/><circle cx="1057" cy="370" r="26" fill="#0b1733" stroke="#2ad4ff" stroke-width="2"/><g transform="translate(1045 358) scale(1)" fill="none" stroke="#2ad4ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></g><text x="1057" y="236" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="1.5" fill="#2ad4ff">GATE</text><path class="flow cy" d="M1300 552 V610 H800 V560"/><polygon points="800.0,548.0 808.0,562.0 792.0,562.0" fill="#2ad4ff"/>
  <rect x="560" y="592" width="760" height="40" rx="20" fill="#0b1733" stroke="#24407e"/><text x="940" y="618" text-anchor="middle" font-size="18" font-weight="650" fill="#8ec1ff">Rollback: the most rehearsed path. One command, exercised in staging.</text>
  <text x="800" y="710" text-anchor="middle" font-size="18" fill="#93a8d1">No standing production credentials. Everything the agent writes arrives as a pull request.</text></svg>
