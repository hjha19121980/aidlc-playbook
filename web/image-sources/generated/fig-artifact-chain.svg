  <rect x="545" y="570" width="500" height="40" rx="20" fill="#0b1733" stroke="#24407e"/><text x="795" y="596" text-anchor="middle" font-size="18" font-weight="650" fill="#8ec1ff">What Maintain finds becomes the next intent.md</text>
  <text x="800" y="710" text-anchor="middle" font-size="18" fill="#93a8d1">Early artifacts are Markdown so a product owner and an agent can read and act on the same file. From Build on, the artifact is code and its records.</text></svg>
