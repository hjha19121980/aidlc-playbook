<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="t d" font-family="'Segoe UI Variable', 'Segoe UI', Inter, Roboto, Arial, sans-serif">
  <title id="t">Connectors</title>
  <desc id="d">The agent connects through a connector layer to Git, Figma, Jira and Confluence, with an open slot for company-specific connectors. Stages on the left use them.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050c1d"/><stop offset="1" stop-color="#0a1a3d"/></linearGradient>
    <radialGradient id="g1" cx="0.9" cy="0.0" r="0.7"><stop offset="0" stop-color="#5b9bff" stop-opacity="0.28"/><stop offset="1" stop-color="#5b9bff" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0.05" cy="1" r="0.6"><stop offset="0" stop-color="#2ad4ff" stop-opacity="0.2"/><stop offset="1" stop-color="#2ad4ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1d40"/><stop offset="1" stop-color="#0b1733"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2ad4ff"/><stop offset="1" stop-color="#5b9bff"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8ec1ff"/><stop offset="1" stop-color="#2ad4ff"/></linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#5b9bff" fill-opacity="0.16"/></pattern>
    <style>
      .flow { fill: none; stroke: #5b9bff; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 8 8; animation: dash 0.9s linear infinite; }
      .flow.cy { stroke: #2ad4ff; }
      .flow.mute { stroke: #6b7fa8; }
      @keyframes dash { to { stroke-dashoffset: -16; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } .dot { display: none; } }
    </style>
  </defs>
  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#dots)"/>
  <rect width="1600" height="800" fill="url(#g1)"/>
  <rect width="1600" height="800" fill="url(#g2)"/>
<text x="80" y="92" font-size="42" font-weight="800" fill="#e8f0ff" letter-spacing="-1">Connectors: read first, write with approval</text><text x="80" y="134" font-size="21" fill="#93a8d1">Tickets, pages and designs stay the system of record. The repository links to them and back.</text><rect x="70" y="200" width="230" height="60" rx="30" fill="#0b1733" stroke="#24407e" stroke-width="1.5"/><text x="185" y="238" text-anchor="middle" font-size="20" font-weight="700" fill="#e8f0ff">Plan</text><path class="flow" d="M300 230 C390 230 400 440 480 440" /><rect x="70" y="278" width="230" height="60" rx="30" fill="#0b1733" stroke="#24407e" stroke-width="1.5"/><text x="185" y="316" text-anchor="middle" font-size="20" font-weight="700" fill="#e8f0ff">Design</text><path class="flow" d="M300 308 C390 308 400 440 480 440" /><rect x="70" y="356" width="230" height="60" rx="30" fill="#0b1733" stroke="#24407e" stroke-width="1.5"/><text x="185" y="394" text-anchor="middle" font-size="20" font-weight="700" fill="#e8f0ff">Build</text><path class="flow" d="M300 386 C390 386 400 440 480 440" /><rect x="70" y="434" width="230" height="60" rx="30" fill="#0b1733" stroke="#24407e" stroke-width="1.5"/><text x="185" y="472" text-anchor="middle" font-size="20" font-weight="700" fill="#e8f0ff">Test</text><path class="flow" d="M300 464 C390 464 400 440 480 440" /><rect x="70" y="512" width="230" height="60" rx="30" fill="#0b1733" stroke="#24407e" stroke-width="1.5"/><text x="185" y="550" text-anchor="middle" font-size="20" font-weight="700" fill="#e8f0ff">Deploy</text><path class="flow" d="M300 542 C390 542 400 440 480 440" /><rect x="70" y="590" width="230" height="60" rx="30" fill="#0b1733" stroke="#24407e" stroke-width="1.5"/><text x="185" y="628" text-anchor="middle" font-size="20" font-weight="700" fill="#e8f0ff">Maintain</text><path class="flow" d="M300 620 C390 620 400 440 480 440" /><rect x="480" y="300" width="420" height="280" rx="24" fill="url(#card)" stroke="#2ad4ff" stroke-width="1.5"/><rect x="504" y="324" width="372" height="40" rx="20" fill="#5b9bff" fill-opacity=".14" stroke="#5b9bff" stroke-opacity=".5"/><text x="690" y="351" text-anchor="middle" font-size="16" font-weight="700" fill="#8ec1ff">Connector layer (MCP)</text>
  <rect x="630" y="386" width="120" height="120" rx="33.6" fill="url(#brand)"/><g transform="translate(654 410) scale(3)" fill="none" stroke="#04112b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 3v4M21 5h-4"/><path d="M5 17v4M7 19H3"/></g><text x="690" y="548" text-anchor="middle" font-size="26" font-weight="800" fill="#e8f0ff">Agent</text><text x="690" y="572" text-anchor="middle" font-size="15" fill="#93a8d1">terminal agent or Copilot</text><rect x="1080" y="190" width="440" height="84" rx="18" fill="url(#card)" stroke="#24407e" stroke-width="1.5"/><rect x="1098" y="204" width="56" height="56" rx="15.680000000000001" fill="url(#brand)"/><g transform="translate(1110.4 216.4) scale(1.3)" fill="none" stroke="#04112b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5m-2 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0"/><path d="M6 19m-2 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0"/><path d="M18 7m-2 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0"/><path d="M6 7v10"/><path d="M18 9a8 8 0 0 1-8 8"/></g><text x="1174" y="226" font-size="22" font-weight="750" fill="#e8f0ff">Git</text><text x="1174" y="252" font-size="15" fill="#93a8d1">Branch, diff, history</text><path class="flow " d="M900 440 C990 440 1000 232 1074 232"/><rect x="1080" y="290" width="440" height="84" rx="18" fill="url(#card)" stroke="#24407e" stroke-width="1.5"/><rect x="1098" y="304" width="56" height="56" rx="15.680000000000001" fill="url(#brand)"/><g transform="translate(1110.4 316.4) scale(1.3)" fill="none" stroke="#04112b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-5L16 4l4 4L9 19z"/><path d="M14 6l4 4"/></g><text x="1174" y="326" font-size="22" font-weight="750" fill="#e8f0ff">Figma</text><text x="1174" y="352" font-size="15" fill="#93a8d1">Design context and mock comparison</text><path class="flow " d="M900 440 C990 440 1000 332 1074 332"/><rect x="1080" y="390" width="440" height="84" rx="18" fill="url(#card)" stroke="#24407e" stroke-width="1.5"/><rect x="1098" y="404" width="56" height="56" rx="15.680000000000001" fill="url(#brand)"/><g transform="translate(1110.4 416.4) scale(1.3)" fill="none" stroke="#04112b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v3H8z"/><path d="M6 5H5v16h14V5h-1"/><path d="M9 12h6M9 16h4"/></g><text x="1174" y="426" font-size="22" font-weight="750" fill="#e8f0ff">Jira</text><text x="1174" y="452" font-size="15" fill="#93a8d1">Ticket in, status and commit link back</text><path class="flow " d="M900 440 C990 440 1000 432 1074 432"/><rect x="1080" y="490" width="440" height="84" rx="18" fill="url(#card)" stroke="#24407e" stroke-width="1.5"/><rect x="1098" y="504" width="56" height="56" rx="15.680000000000001" fill="url(#brand)"/><g transform="translate(1110.4 516.4) scale(1.3)" fill="none" stroke="#04112b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M8 7h7"/></g><text x="1174" y="526" font-size="22" font-weight="750" fill="#e8f0ff">Confluence</text><text x="1174" y="552" font-size="15" fill="#93a8d1">Standards in, approved outputs out</text><path class="flow " d="M900 440 C990 440 1000 532 1074 532"/><rect x="1080" y="590" width="440" height="84" rx="18" fill="none" stroke="#2ad4ff" stroke-width="2" stroke-dasharray="8 8"/><rect x="1098" y="604" width="56" height="56" rx="16" fill="#2ad4ff" fill-opacity=".14" stroke="#2ad4ff" stroke-opacity=".6"/><g transform="translate(1112 618) scale(1.2)" fill="none" stroke="#2ad4ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></g><text x="1174" y="626" font-size="22" font-weight="750" fill="#e8f0ff">Your company connector</text><text x="1174" y="652" font-size="15" fill="#93a8d1">Any approved internal system</text><path class="flow mute" d="M900 440 C990 440 1000 632 1074 632"/><rect x="80" y="700" width="1440" height="54" rx="27" fill="#5b9bff" fill-opacity=".14" stroke="#5b9bff" stroke-opacity=".55"/><text x="800" y="733.3" text-anchor="middle" font-size="18" font-weight="650" fill="#e8f0ff">No secrets in the repository. Writes need confirmation and a named approver. Content from a connector is data, never instructions.</text></svg>
