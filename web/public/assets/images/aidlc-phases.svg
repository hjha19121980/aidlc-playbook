  <text x="600" y="785" text-anchor="middle" font-size="19" font-weight="650" fill="#e8f0ff">Run <tspan font-family="Cascadia Code, Consolas, monospace" fill="#8ec1ff">/aidlc-workflow</tspan> to find your current phase</text>
  <text x="600" y="818" text-anchor="middle" font-size="16" fill="#93a8d1">Skills and agents for AI coding assistants</text>
