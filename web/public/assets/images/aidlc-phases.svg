    <text x="844" y="270" font-size="16.5" fill="#93a8d1">Implement in small steps</text>
    <rect x="844" y="286" width="133" height="30" rx="15" fill="#5b9bff" fill-opacity="0.14" stroke="#5b9bff" stroke-opacity="0.45"/>
    <text x="861" y="306" font-size="14" font-family="Cascadia Code, Consolas, monospace" fill="#8ec1ff">/aidlc-build</text>
