    <rect x="100" y="170" width="300" height="200" rx="22" fill="none" stroke="url(#edge)" stroke-width="1.5" opacity="0.55"/>
    <circle cx="136" cy="208" r="17" fill="url(#brand)"/>
    <text x="136" y="214" text-anchor="middle" font-size="17" font-weight="800" fill="#04112b">1</text>
    <text x="164" y="218" font-size="29" font-weight="750" fill="#e8f0ff" letter-spacing="-0.5">Plan</text>
    <rect x="332" y="188" width="52" height="52" rx="15" fill="url(#brand)"/>
