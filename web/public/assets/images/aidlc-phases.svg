    <circle cx="496" cy="538" r="17" fill="url(#brand)"/>
    <text x="496" y="544" text-anchor="middle" font-size="17" font-weight="800" fill="#04112b">5</text>
    <text x="524" y="548" font-size="29" font-weight="750" fill="#e8f0ff" letter-spacing="-0.5">Deploy</text>
    <rect x="692" y="518" width="52" height="52" rx="15" fill="url(#brand)"/>
    <g transform="translate(700 526) scale(1.5)" stroke="#04112b" stroke-width="1.8"><path d="M7 18a5 5 0 1 1 1-9.9A6 6 0 0 1 19.5 10 4 4 0 0 1 18 18" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M12 11v8" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M9 14l3-3 3 3" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g>
    <text x="484" y="600" font-size="16.5" fill="#93a8d1">Release safely, with a way back</text>
    <rect x="484" y="616" width="142" height="30" rx="15" fill="#5b9bff" fill-opacity="0.14" stroke="#5b9bff" stroke-opacity="0.45"/>
