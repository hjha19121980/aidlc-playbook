    <text x="150" y="346" font-size="14.5" font-weight="650" fill="#3ddc97">Gate: Requirements approved</text>
  </g>
  <g>
    <rect x="460" y="170" width="300" height="200" rx="22" fill="url(#card)" stroke="#24407e" stroke-width="1.5"/>
