    <text x="510" y="676" font-size="14.5" font-weight="650" fill="#3ddc97">Gate: Production approval</text>
  </g>
  <g>
    <rect x="100" y="500" width="300" height="200" rx="22" fill="url(#card)" stroke="#24407e" stroke-width="1.5"/>
    <rect x="100" y="500" width="300" height="200" rx="22" fill="none" stroke="url(#edge)" stroke-width="1.5" opacity="0.55"/>
