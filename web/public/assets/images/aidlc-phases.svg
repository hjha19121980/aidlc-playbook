    <rect x="1052" y="518" width="52" height="52" rx="15" fill="url(#brand)"/>
    <g transform="translate(1060 526) scale(1.5)" stroke="#04112b" stroke-width="1.8"><path d="M9 3h6" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M10 3v6L4 19a2 2 0 0 0 2 3h12a2 2 0 0 0 2-3l-6-10V3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M7 15h10" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g>
    <text x="844" y="600" font-size="16.5" fill="#93a8d1">Prove it meets the requirements</text>
