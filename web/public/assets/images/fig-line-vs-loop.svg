<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="t d" font-family="'Segoe UI Variable', 'Segoe UI', Inter, Roboto, Arial, sans-serif">
  <title id="t">The line and the loop</title>
  <desc id="d">Left: the traditional line of six stages with one slow loop back as a new release cycle. Right: the AIDLC loop of six stages with people above the loop directing and governing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050c1d"/><stop offset="1" stop-color="#0a1a3d"/></linearGradient>
    <radialGradient id="g1" cx="0.9" cy="0.0" r="0.7"><stop offset="0" stop-color="#5b9bff" stop-opacity="0.28"/><stop offset="1" stop-color="#5b9bff" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0.05" cy="1" r="0.6"><stop offset="0" stop-color="#2ad4ff" stop-opacity="0.2"/><stop offset="1" stop-color="#2ad4ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1d40"/><stop offset="1" stop-color="#0b1733"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2ad4ff"/><stop offset="1" stop-color="#5b9bff"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8ec1ff"/><stop offset="1" stop-color="#2ad4ff"/></linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#5b9bff" fill-opacity="0.16"/></pattern>
    <style>
      .flow { fill: none; stroke: #5b9bff; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 8 8; animation: dash 0.9s linear infinite; }
      .flow.cy { stroke: #2ad4ff; }
      .flow.mute { stroke: #6b7fa8; }
      @keyframes dash { to { stroke-dashoffset: -16; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } .dot { display: none; } }
    </style>
  </defs>
  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#dots)"/>
  <rect width="1600" height="800" fill="url(#g1)"/>
  <rect width="1600" height="800" fill="url(#g2)"/>
<rect x="50" y="60" width="720" height="680" rx="22" fill="url(#card)" stroke="#24407e" stroke-width="1.5"/><rect x="830" y="60" width="720" height="680" rx="22" fill="url(#card)" stroke="#24407e" stroke-width="1.5"/><text x="80" y="122" font-size="32" font-weight="800" fill="#e8f0ff">Traditional SDLC</text><text x="80" y="156" font-size="18" fill="#93a8d1">The line</text>
  <text x="860" y="122" font-size="32" font-weight="800" fill="#e8f0ff">AI-native SDLC (<tspan fill="#2ad4ff">AIDLC</tspan>)</text><text x="860" y="156" font-size="18" fill="#93a8d1">The loop</text><rect x="76" y="330" width="96" height="74" rx="14" fill="#0b1733" stroke="#24407e" stroke-width="1.5"/><text x="124" y="373" text-anchor="middle" font-size="16" font-weight="700" fill="#e8f0ff">Plan</text><path d="M174 367 H184" stroke="#6b7fa8" stroke-width="2.5" stroke-linecap="round"/><polygon points="194.0,367.0 185.0,373.0 185.0,361.0" fill="#6b7fa8"/><rect x="192" y="330" width="96" height="74" rx="14" fill="#0b1733" stroke="#24407e" stroke-width="1.5"/><text x="240" y="373" text-anchor="middle" font-size="16" font-weight="700" fill="#e8f0ff">Design</text><path d="M290 367 H300" stroke="#6b7fa8" stroke-width="2.5" stroke-linecap="round"/><polygon points="310.0,367.0 301.0,373.0 301.0,361.0" fill="#6b7fa8"/><rect x="308" y="330" width="96" height="74" rx="14" fill="#0b1733" stroke="#24407e" stroke-width="1.5"/><text x="356" y="373" text-anchor="middle" font-size="16" font-weight="700" fill="#e8f0ff">Build</text><path d="M406 367 H416" stroke="#6b7fa8" stroke-width="2.5" stroke-linecap="round"/><polygon points="426.0,367.0 417.0,373.0 417.0,361.0" fill="#6b7fa8"/><rect x="424" y="330" width="96" height="74" rx="14" fill="#0b1733" stroke="#24407e" stroke-width="1.5"/><text x="472" y="373" text-anchor="middle" font-size="16" font-weight="700" fill="#e8f0ff">Test</text><path d="M522 367 H532" stroke="#6b7fa8" stroke-width="2.5" stroke-linecap="round"/><polygon points="542.0,367.0 533.0,373.0 533.0,361.0" fill="#6b7fa8"/><rect x="540" y="330" width="96" height="74" rx="14" fill="#0b1733" stroke="#24407e" stroke-width="1.5"/><text x="588" y="373" text-anchor="middle" font-size="16" font-weight="700" fill="#e8f0ff">Deploy</text><path d="M638 367 H648" stroke="#6b7fa8" stroke-width="2.5" stroke-linecap="round"/><polygon points="658.0,367.0 649.0,373.0 649.0,361.0" fill="#6b7fa8"/><rect x="656" y="330" width="96" height="74" rx="14" fill="#0b1733" stroke="#24407e" stroke-width="1.5"/><text x="704" y="373" text-anchor="middle" font-size="16" font-weight="700" fill="#e8f0ff">Maintain</text><path class="flow mute" d="M704 408 C704 510 124 510 124 412"/><polygon points="124.0,408.0 132.0,422.0 116.0,422.0" fill="#6b7fa8"/>
  <rect x="190" y="505" width="400" height="36" rx="18" fill="#0b1733" stroke="#24407e"/><text x="390" y="529" text-anchor="middle" font-size="16" font-weight="650" fill="#93a8d1">One slow loop back is a new release cycle</text>
  <text x="80" y="240" font-size="18" fill="#93a8d1">Each stage is a handoff between roles, through</text><text x="80" y="266" font-size="18" fill="#93a8d1">documents, tickets and sign-offs.</text><path class="flow cy" d="M1247.0 244.5 A175 175 0 0 1 1295.3 270.2"/><polygon points="1295.3,270.2 1279.3,268.2 1289.0,255.4" fill="#2ad4ff"/><path class="flow cy" d="M1361.8 376.6 A175 175 0 0 1 1363.7 431.3"/><polygon points="1363.7,431.3 1357.5,416.5 1373.3,418.4" fill="#2ad4ff"/><path class="flow cy" d="M1304.8 542.1 A175 175 0 0 1 1258.4 571.1"/><polygon points="1258.4,571.1 1268.1,558.3 1274.4,573.0" fill="#2ad4ff"/><path class="flow cy" d="M1133.0 575.5 A175 175 0 0 1 1084.7 549.8"/><polygon points="1084.7,549.8 1100.7,551.8 1091.0,564.6" fill="#2ad4ff"/><path class="flow cy" d="M1018.2 443.4 A175 175 0 0 1 1016.3 388.7"/><polygon points="1016.3,388.7 1022.5,403.5 1006.7,401.6" fill="#2ad4ff"/><path class="flow cy" d="M1075.2 277.9 A175 175 0 0 1 1121.6 248.9"/><polygon points="1121.6,248.9 1111.9,261.7 1105.6,247.0" fill="#2ad4ff"/><g class="dot"><circle r="15" fill="#2ad4ff" fill-opacity=".22"/><circle r="6.5" fill="#ffffff"/><animateMotion dur="14s" begin="-0.00s" repeatCount="indefinite" path="M1190 235 A175 175 0 1 1 1190 585 A175 175 0 1 1 1190 235"/></g><g class="dot"><circle r="15" fill="#2ad4ff" fill-opacity=".22"/><circle r="6.5" fill="#ffffff"/><animateMotion dur="14s" begin="-4.67s" repeatCount="indefinite" path="M1190 235 A175 175 0 1 1 1190 585 A175 175 0 1 1 1190 235"/></g><g class="dot"><circle r="15" fill="#2ad4ff" fill-opacity=".22"/><circle r="6.5" fill="#ffffff"/><animateMotion dur="14s" begin="-9.33s" repeatCount="indefinite" path="M1190 235 A175 175 0 1 1 1190 585 A175 175 0 1 1 1190 235"/></g><circle cx="1190.0" cy="235.0" r="54" fill="#5b9bff" fill-opacity=".1"/><circle cx="1190.0" cy="235.0" r="46" fill="url(#brand)"/><text x="1190.0" y="240.0" text-anchor="middle" font-size="16" font-weight="800" fill="#04112b">Plan</text><circle cx="1341.6" cy="322.5" r="54" fill="#5b9bff" fill-opacity=".1"/><circle cx="1341.6" cy="322.5" r="46" fill="url(#brand)"/><text x="1341.6" y="327.5" text-anchor="middle" font-size="16" font-weight="800" fill="#04112b">Design</text><circle cx="1341.6" cy="497.5" r="54" fill="#5b9bff" fill-opacity=".1"/><circle cx="1341.6" cy="497.5" r="46" fill="url(#brand)"/><text x="1341.6" y="502.5" text-anchor="middle" font-size="16" font-weight="800" fill="#04112b">Build</text><circle cx="1190.0" cy="585.0" r="54" fill="#5b9bff" fill-opacity=".1"/><circle cx="1190.0" cy="585.0" r="46" fill="url(#brand)"/><text x="1190.0" y="590.0" text-anchor="middle" font-size="16" font-weight="800" fill="#04112b">Test</text><circle cx="1038.4" cy="497.5" r="54" fill="#5b9bff" fill-opacity=".1"/><circle cx="1038.4" cy="497.5" r="46" fill="url(#brand)"/><text x="1038.4" y="502.5" text-anchor="middle" font-size="16" font-weight="800" fill="#04112b">Deploy</text><circle cx="1038.4" cy="322.5" r="54" fill="#5b9bff" fill-opacity=".1"/><circle cx="1038.4" cy="322.5" r="46" fill="url(#brand)"/><text x="1038.4" y="327.5" text-anchor="middle" font-size="16" font-weight="800" fill="#04112b">Maintain</text><circle cx="1190" cy="410" r="76" fill="#0b1733" stroke="#2ad4ff" stroke-opacity=".6" stroke-width="1.5"/><g transform="translate(1173 358) scale(1.4)" fill="none" stroke="#3ddc97" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></g><text x="1190" y="422" text-anchor="middle" font-size="16" font-weight="800" fill="#e8f0ff">Humans above</text><text x="1190" y="443" text-anchor="middle" font-size="16" font-weight="800" fill="#e8f0ff">the loop</text>
  <text x="1190" y="700" text-anchor="middle" font-size="17" fill="#93a8d1">Shorter loops. People instigate, direct and govern.</text></svg>
