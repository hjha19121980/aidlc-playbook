<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AIDLC Playbook</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A playbook and skill library for the AI-Driven Development Life Cycle, for AI coding assistants that support skills and agents.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    // Set theme before first paint to avoid a flash.
    (function () {
      var t = null;
      try { t = localStorage.getItem('aidlc-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
