ty=".5"/><g transform="translate(390.8120228041362 927.8212477731586) scale(0.83)" fill="none" stroke="#8ec1ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v3H8z"/><path d="M6 5H5v16h14V5h-1"/><path d="M9 12h6M9 16h4"/></g><circle cx="91.0" cy="568.6" r="19" fill="#0b1733" stroke="#2ad4ff" stroke-opacity=".5"/><g transform="translate(80.99873939347208 558.6001542350915) scale(0.83)" fill="none" stroke="#8ec1ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M8 7h7"/></g><circle cx="346.4" cy="159.9" r="19" fill="#0b1733" stroke="#2ad4ff" stroke-opacity=".5"/><g transform="translate(336.411296699476 149.85461962761718) scale(0.83)" fill="none" stroke="#8ec1ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2v6M15 2v6"/><path d="M6 8h12v4a6 6 0 0 1-12 0z"/><path d="M12 18v4"/></g><circle cx="910" cy="540" r="15" fill="#0b1733" stroke="#2ad4ff" stroke-width="1.8"/><text x="910" y="545.5" text-anchor="middle" font-size="15" font-weight="800" fill="#8ec1ff">1</text><circle cx="1024" cy="173" r="15" fill="#0b1733" stroke="#2ad4ff" stroke-width="1.8"/><text x="1024" y="178.5" text-anchor="middle" font-size="15" font-weight="800" fill="#8ec1ff">1</text><text x="1056" y="181" font-size="25" font-weight="800" fill="#e8f0ff">Connectors (MCP)</text><text x="1056" y="211" font-size="17" fill="#93a8d1">Git, Figma, Jira, Confluence and your company</text><text x="1056" y="235" font-size="17" fill="#93a8d1">servers. Read first; writes need approval.</text><circle cx="850" cy="540" r="15" fill="#0b1733" stroke="#2ad4ff" stroke-width="1.8"/><text x="850" y="545.5" text-anchor="middle" font-size="15" font-weight="800" fill="#8ec1ff">2</text><circle cx="1024" cy="315" r="15" fill="#0b1733" stroke="#2ad4ff" stroke-width="1.8"/><text x="1024" y="320.5" text-anchor="middle" font-size="15" font-weight="800" fill="#8ec1ff">2</text><text x="1056" y="323" font-size="25" font-weight="800" fill="#e8f0ff">Guardrails</text><text x="1056" y="353" font-size="17" fill="#93a8d1">Branch protection, required CI checks, protected</text><text x="1056" y="377" font-size="17" fill="#93a8d1">paths, evals and control bands.</text><circle cx="790" cy="540" r="15" fill="#0b1733" stroke="#2ad4ff" stroke-width="1.8"/><text x="790" y="545.5" text-anchor="middle" font-size="15" font-weight="800" fill="#8ec1ff">3</text><circle cx="1024" cy="457" r="15" fill="#0b1733" stroke="#2ad4ff" stroke-width="1.8"/><text x="1024" y="462.5" text-anchor="middle" font-size="15" font-weight="800" fill="#8ec1ff">3</text><text x="1056" y="465" font-size="25" font-weight="800" fill="#e8f0ff">Skills and agents</text><text x="1056" y="495" font-size="17" fill="#93a8d1">77 skills across every stage and 10 agents,</text><text x="1056" y="519" font-size="17" fill="#93a8d1">written once and installed for both assistants, or</text><text x="1056" y="543" font-size="17" fill="#93a8d1">only the ones a role needs.</text><circle cx="730" cy="540" r="15" fill="#0b1733" stroke="#2ad4ff" stroke-width="1.8"/><text x="730" y="545.5" text-anchor="middle" font-size="15" font-weight="800" fill="#8ec1ff">4</text><circle cx="1024" cy="599" r="15" fill="#0b1733" stroke="#2ad4ff" stroke-width="1.8"/><text x="1024" y="604.5" text-anchor="middle" font-size="15" font-weight="800" fill="#8ec1ff">4</text><text x="1056" y="607" font-size="25" font-weight="800" fill="#e8f0ff">Artifacts</text><text x="1056" y="637" font-size="17" fill="#93a8d1">intent, spec, plan, test report, review findings,</text><text x="1056" y="661" font-size="17" fill="#93a8d1">release, incident, plus AGENTS.md and REVIEW.md.</text><circle cx="640" cy="540" r="15" fill="#0b1733" stroke="#2ad4ff" stroke-width="1.8"/><text x="640" y="545.5" text-anchor="middle" font-size="15" font-weight="800" fill="#8ec1ff">5</text><circle cx="1024" cy="741" r="15" fill="#0b1733" stroke="#2ad4ff" stroke-width="1.8"/><text x="1024" y="746.5" text-anchor="middle" font-size="15" font-weight="800" fill="#8ec1ff">5</text><text x="1056" y="749" font-size="25" font-weight="800" fill="#e8f0ff">The loop</text><text x="1056" y="779" font-size="17" fill="#93a8d1">Plan, Design, Build, Test, Deploy and Maintain,</text><text x="1056" y="803" font-size="17" fill="#93a8d1">with a human gate at each stage.</text><text x="1056" y="891" font-size="25" font-weight="800" fill="#e8f0ff">People (center)</text><text x="1056" y="921" font-size="17" fill="#93a8d1">Product owner, tech lead, code owner, release</text><text x="1056" y="945" font-size="17" fill="#93a8d1">manager and service owner decide at the gates.</text><text x="1030" y="998" font-size="17" font-weight="650" fill="#8ec1ff">One source, installed for a terminal AI agent</text><text x="1030" y="1022" font-size="17" font-weight="650" fill="#8ec1ff">and for GitHub Copilot.</text></svg>
