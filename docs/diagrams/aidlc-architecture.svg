<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1060" width="1500" height="1060" role="img" aria-labelledby="t d" font-family="'Segoe UI Variable', 'Segoe UI', Inter, Roboto, Arial, sans-serif">
  <title id="t">AIDLC architecture</title>
  <desc id="d">Concentric layers around the loop. From the center: people and gates, the six-stage loop, committed artifacts, skills and agents, guardrails, and connectors.</desc>
