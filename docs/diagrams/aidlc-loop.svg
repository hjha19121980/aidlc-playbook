    <circle cx="746.0" cy="184.0" r="15" fill="#0b1733" stroke="#2ad4ff" stroke-width="1.5"/><text x="746.0" y="189.5" text-anchor="middle" font-size="15" font-weight="800" fill="#8ec1ff">1</text><text x="700.0" y="118.0" text-anchor="middle" font-size="21" font-weight="700" font-family="'Cascadia Code', Consolas, 'SF Mono', monospace" fill="#e8f0ff">intent.md</text><text x="700.0" y="146.0" text-anchor="middle" font-size="16" font-weight="650" fill="#3ddc97">Product owner accepts</text><circle cx="951.1" cy="375.0" r="74" fill="#5b9bff" fill-opacity=".1"/><circle cx="951.1" cy="375.0" r="62" fill="url(#brand)"/>
    <g transform="translate(936.1473670974872 339) scale(1.25)" fill="none" stroke="#04112b" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-5L16 4l4 4L9 19z"/><path d="M14 6l4 4"/></g><text x="951.1" y="401.0" text-anchor="middle" font-size="20" font-weight="800" fill="#04112b">Design</text>
    <circle cx="997.1" cy="329.0" r="15" fill="#0b1733" stroke="#2ad4ff" stroke-width="1.5"/><text x="997.1" y="334.5" text-anchor="middle" font-size="15" font-weight="800" fill="#8ec1ff">2</text><text x="1041.1" y="363.0" text-anchor="start" font-size="21" font-weight="700" font-family="'Cascadia Code', Consolas, 'SF Mono', monospace" fill="#e8f0ff">spec.md</text><text x="1041.1" y="391.0" text-anchor="start" font-size="16" font-weight="650" fill="#3ddc97">Product owner accepts</text><circle cx="951.1" cy="665.0" r="74" fill="#5b9bff" fill-opacity=".1"/><circle cx="951.1" cy="665.0" r="62" fill="url(#brand)"/>
    <g transform="translate(936.1473670974872 629) scale(1.25)" fill="none" stroke="#04112b" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-5 5 5 5"/><path d="M16 7l5 5-5 5"/><path d="M14 4l-4 16"/></g><text x="951.1" y="691.0" text-anchor="middle" font-size="20" font-weight="800" fill="#04112b">Build</text>
    <circle cx="997.1" cy="619.0" r="15" fill="#0b1733" stroke="#2ad4ff" stroke-width="1.5"/><text x="997.1" y="624.5" text-anchor="middle" font-size="15" font-weight="800" fill="#8ec1ff">3</text><text x="1041.1" y="653.0" text-anchor="start" font-size="21" font-weight="700" font-family="'Cascadia Code', Consolas, 'SF Mono', monospace" fill="#e8f0ff">plan.md, diff, tests</text><text x="1041.1" y="681.0" text-anchor="start" font-size="16" font-weight="650" fill="#3ddc97">Engineer accepts the plan</text><text x="1041.1" y="703.0" text-anchor="start" font-size="16" font-weight="650" fill="#3ddc97">Code owner approves the PR</text><circle cx="700.0" cy="810.0" r="74" fill="#5b9bff" fill-opacity=".1"/><circle cx="700.0" cy="810.0" r="62" fill="url(#brand)"/>
    <g transform="translate(685 774) scale(1.25)" fill="none" stroke="#04112b" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v6L4 19a2 2 0 0 0 2 3h12a2 2 0 0 0 2-3l-6-10V3"/><path d="M7 15h10"/></g><text x="700.0" y="836.0" text-anchor="middle" font-size="20" font-weight="800" fill="#04112b">Test</text>
    <circle cx="746.0" cy="764.0" r="15" fill="#0b1733" stroke="#2ad4ff" stroke-width="1.5"/><text x="746.0" y="769.5" text-anchor="middle" font-size="15" font-weight="800" fill="#8ec1ff">4</text><text x="700.0" y="916.0" text-anchor="middle" font-size="21" font-weight="700" font-family="'Cascadia Code', Consolas, 'SF Mono', monospace" fill="#e8f0ff">test-report.md, evals</text><text x="700.0" y="944.0" text-anchor="middle" font-size="16" font-weight="650" fill="#3ddc97">Code owner reviews evidence</text><circle cx="448.9" cy="665.0" r="74" fill="#5b9bff" fill-opacity=".1"/><circle cx="448.9" cy="665.0" r="62" fill="url(#brand)"/>
    <g transform="translate(433.85263290251277 629) scale(1.25)" fill="none" stroke="#04112b" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a5 5 0 1 1 1-9.9A6 6 0 0 1 19.5 10 4 4 0 0 1 18 18"/><path d="M12 11v8"/><path d="M9 14l3-3 3 3"/></g><text x="448.9" y="691.0" text-anchor="middle" font-size="20" font-weight="800" fill="#04112b">Deploy</text>
    <circle cx="494.9" cy="619.0" r="15" fill="#0b1733" stroke="#2ad4ff" stroke-width="1.5"/><text x="494.9" y="624.5" text-anchor="middle" font-size="15" font-weight="800" fill="#8ec1ff">5</text><text x="358.9" y="653.0" text-anchor="end" font-size="21" font-weight="700" font-family="'Cascadia Code', Consolas, 'SF Mono', monospace" fill="#e8f0ff">review findings, release.md</text><text x="358.9" y="681.0" text-anchor="end" font-size="16" font-weight="650" fill="#3ddc97">Release manager authorizes</text><circle cx="448.9" cy="375.0" r="74" fill="#5b9bff" fill-opacity=".1"/><circle cx="448.9" cy="375.0" r="62" fill="url(#brand)"/>
    <g transform="translate(433.8526329025128 339) scale(1.25)" fill="none" stroke="#04112b" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></g><text x="448.9" y="401.0" text-anchor="middle" font-size="20" font-weight="800" fill="#04112b">Maintain</text>
    <circle cx="494.9" cy="329.0" r="15" fill="#0b1733" stroke="#2ad4ff" stroke-width="1.5"/><text x="494.9" y="334.5" text-anchor="middle" font-size="15" font-weight="800" fill="#8ec1ff">6</text><text x="358.9" y="363.0" text-anchor="end" font-size="21" font-weight="700" font-family="'Cascadia Code', Consolas, 'SF Mono', monospace" fill="#e8f0ff">incident.md, new intent.md</text><text x="358.9" y="391.0" text-anchor="end" font-size="16" font-weight="650" fill="#3ddc97">Service owner triages</text><circle cx="700" cy="520" r="132" fill="#0b1733" stroke="#2ad4ff" stroke-opacity=".5" stroke-width="1.5"/><g transform="translate(678 428) scale(1.85)" fill="none" stroke="#3ddc97" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></g>
  <text x="700" y="526" text-anchor="middle" font-size="26" font-weight="800" fill="#e8f0ff">Agents act up to</text><text x="700" y="558" text-anchor="middle" font-size="26" font-weight="800" fill="#e8f0ff">a gate.</text>
  <text x="700" y="598" text-anchor="middle" font-size="19" font-weight="650" fill="#2ad4ff">People decide.</text></svg>
