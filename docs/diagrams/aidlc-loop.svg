<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" role="img" aria-labelledby="t d" font-family="'Segoe UI Variable', 'Segoe UI', Inter, Roboto, Arial, sans-serif">
  <title id="t">The AIDLC loop</title>
  <desc id="d">A circular flow of six stages: Plan, Design, Build, Test, Deploy and Maintain. Each stage commits an artifact the next stage reads and ends at a human gate. What Maintain finds becomes the next intent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050c1d"/><stop offset="1" stop-color="#0a1a3d"/></linearGradient>
    <radialGradient id="g1" cx="0.9" cy="0.0" r="0.7"><stop offset="0" stop-color="#5b9bff" stop-opacity="0.28"/><stop offset="1" stop-color="#5b9bff" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0.05" cy="1" r="0.6"><stop offset="0" stop-color="#2ad4ff" stop-opacity="0.2"/><stop offset="1" stop-color="#2ad4ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1d40"/><stop offset="1" stop-color="#0b1733"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2ad4ff"/><stop offset="1" stop-color="#5b9bff"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8ec1ff"/><stop offset="1" stop-color="#2ad4ff"/></linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#5b9bff" fill-opacity="0.16"/></pattern>
    <style>
      .flow { fill: none; stroke: #5b9bff; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 8 8; animation: dash 0.9s linear infinite; }
      .flow.cy { stroke: #2ad4ff; }
      .flow.mute { stroke: #6b7fa8; }
      @keyframes dash { to { stroke-dashoffset: -16; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } .dot { display: none; } }
    </style>
  </defs>
  <rect width="1400" height="1000" fill="url(#bg)"/>
  <rect width="1400" height="1000" fill="url(#dots)"/>
  <rect width="1400" height="1000" fill="url(#g1)"/>
  <rect width="1400" height="1000" fill="url(#g2)"/>
<text x="50" y="70" font-size="38" font-weight="800" fill="#e8f0ff" letter-spacing="-1">The <tspan fill="#2ad4ff">AIDLC</tspan> loop</text>
  <text x="50" y="104" font-size="18" fill="#93a8d1">Each stage commits an artifact the next one reads.</text><circle cx="700" cy="520" r="380" fill="#5b9bff" fill-opacity=".05"/><circle cx="700" cy="520" r="290" fill="none" stroke="#24407e" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/><path class="flow cy" d="M768.4 238.2 A290 290 0 0 1 900.7 310.7"/><polygon points="900.7,310.7 885.1,306.8 896.2,295.2" fill="#2ad4ff"/><path class="flow cy" d="M978.2 438.3 A290 290 0 0 1 981.6 589.2"/><polygon points="981.6,589.2 977.2,573.7 992.7,577.5" fill="#2ad4ff"/><path class="flow cy" d="M909.9 720.1 A290 290 0 0 1 780.9 798.5"/><polygon points="780.9,798.5 792.1,786.9 796.6,802.3" fill="#2ad4ff"/><path class="flow cy" d="M631.6 801.8 A290 290 0 0 1 499.3 729.3"/><polygon points="499.3,729.3 514.9,733.2 503.8,744.8" fill="#2ad4ff"/><path class="flow cy" d="M421.8 601.7 A290 290 0 0 1 418.4 450.8"/><polygon points="418.4,450.8 422.8,466.3 407.3,462.5" fill="#2ad4ff"/><path class="flow cy" d="M490.1 319.9 A290 290 0 0 1 619.1 241.5"/><polygon points="619.1,241.5 607.9,253.1 603.4,237.7" fill="#2ad4ff"/><g class="dot"><circle r="15" fill="#2ad4ff" fill-opacity=".22"/><circle r="6.5" fill="#ffffff"/><animateMotion dur="14s" begin="-0.00s" repeatCount="indefinite" path="M700 230 A290 290 0 1 1 700 810 A290 290 0 1 1 700 230"/></g><g class="dot"><circle r="15" fill="#2ad4ff" fill-opacity=".22"/><circle r="6.5" fill="#ffffff"/><animateMotion dur="14s" begin="-4.67s" repeatCount="indefinite" path="M700 230 A290 290 0 1 1 700 810 A290 290 0 1 1 700 230"/></g><g class="dot"><circle r="15" fill="#2ad4ff" fill-opacity=".22"/><circle r="6.5" fill="#ffffff"/><animateMotion dur="14s" begin="-9.33s" repeatCount="indefinite" path="M700 230 A290 290 0 1 1 700 810 A290 290 0 1 1 700 230"/></g><circle cx="700.0" cy="230.0" r="74" fill="#5b9bff" fill-opacity=".1"/><circle cx="700.0" cy="230.0" r="62" fill="url(#brand)"/>
